# Build the open-slide site and publish it with GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Project sites live under /<repo>/; open-slide reads the base from OPEN_SLIDE_BASE.
      - run: npx open-slide build --out-dir public
        env:
          OPEN_SLIDE_BASE: ${{ steps.pages.outputs.base_path }}/
      # Serve the app for deep links like /s/lazy-is-great as well.
      - run: cp public/index.html public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
